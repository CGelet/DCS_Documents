<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F/A-18C – Chuck's Guide</title>
<style>
/* Carlito is metric-compatible with Calibri (the guide's font), so text lines up on devices without Calibri */
@font-face { font-family: Carlito; src: url(fonts/Carlito-Regular.ttf); font-weight: 400; font-style: normal; }
@font-face { font-family: Carlito; src: url(fonts/Carlito-Bold.ttf); font-weight: 700; font-style: normal; }
@font-face { font-family: Carlito; src: url(fonts/Carlito-Italic.ttf); font-weight: 400; font-style: italic; }
@font-face { font-family: Carlito; src: url(fonts/Carlito-BoldItalic.ttf); font-weight: 700; font-style: italic; }
:root, [data-theme="light"] {
  --bg: #f4f5f7; --panel: #ffffff; --panel-2: #eef0f3; --text: #1b1f24; --muted: #5d6673;
  --border: #d7dbe0; --accent: #c8102e; --accent-ink: #ffffff; --hit: rgba(255, 200, 0, .45);
  --hit-strong: rgba(255, 140, 0, .6); --check: #1d8a4e; --shadow: 0 1px 3px rgba(0,0,0,.12);
}
[data-theme="dark"] {
  --bg: #121417; --panel: #1b1e23; --panel-2: #23272e; --text: #e4e7eb; --muted: #959eaa;
  --border: #30353d; --accent: #ff4d5e; --accent-ink: #0d0f12; --hit: rgba(255, 200, 0, .4);
  --hit-strong: rgba(255, 140, 0, .6); --check: #3ecf7d; --shadow: 0 1px 3px rgba(0,0,0,.5);
}
[data-theme="night"] {
  --bg: #050505; --panel: #0b0b0b; --panel-2: #141010; --text: #ff8a7a; --muted: #a85a50;
  --border: #2a1714; --accent: #ff5a46; --accent-ink: #050505; --hit: rgba(255, 90, 70, .35);
  --hit-strong: rgba(255, 90, 70, .6); --check: #ff8a7a; --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg); color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: flex; flex-direction: column; overflow: hidden;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }

/* ---------- Header ---------- */
header {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--panel); border-bottom: 1px solid var(--border); flex-wrap: wrap;
}
.brand { font-weight: 700; white-space: nowrap; margin-right: 4px; }
.brand small { color: var(--muted); font-weight: 500; }
.iconbtn {
  background: var(--panel-2); border: 1px solid var(--border); border-radius: 8px;
  min-width: 36px; height: 36px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center;
}
.iconbtn:hover { border-color: var(--accent); }
.tabs { display: flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 9px; padding: 2px; }
.tabs button { border: 0; background: none; padding: 6px 12px; border-radius: 7px; height: 30px; white-space: nowrap; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
#search {
  flex: 1 1 200px; min-width: 140px; height: 36px; padding: 0 12px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-2);
}
#search:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.pagebox { display: flex; align-items: center; gap: 4px; color: var(--muted); white-space: nowrap; }
.pagebox input {
  width: 56px; height: 36px; text-align: center; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel-2);
}
.settings { position: relative; }
.settings-pop {
  position: absolute; right: 0; top: 42px; z-index: 50; width: 240px; padding: 12px;
  background: var(--panel); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow);
  display: none; flex-direction: column; gap: 10px;
}
.settings.open .settings-pop { display: flex; }
.settings-pop label { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; }
.settings-pop select { background: var(--panel-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px; }

/* ---------- Layout ---------- */
.layout { flex: 1; display: flex; min-height: 0; position: relative; }
aside {
  width: 300px; flex: none; background: var(--panel); border-right: 1px solid var(--border);
  overflow-y: auto; overscroll-behavior: contain;
}
main { flex: 1; min-width: 0; overflow-y: auto; overscroll-behavior: contain; position: relative; }
.view { display: none; }
.view.active { display: block; }
body:not(.guide-tab) #pagebox, body:not(.guide-tab) #modeBtn, body:not(.guide-tab) #altView { display: none; }

/* ---------- TOC ---------- */
.toc { list-style: none; margin: 0; padding: 6px 0 24px; }
.toc ul { list-style: none; margin: 0; padding: 0; display: none; }
.toc li.open > ul { display: block; }
.toc .row { display: flex; align-items: stretch; }
.toc .caret {
  width: 24px; flex: none; border: 0; background: none; color: var(--muted); padding: 0;
  font-size: 11px; transition: transform .15s;
}
.toc li.open > .row > .caret { transform: rotate(90deg); }
.toc .caret.none { visibility: hidden; }
.toc .entry {
  flex: 1; text-align: left; border: 0; background: none; padding: 5px 10px 5px 0;
  display: flex; gap: 8px; justify-content: space-between; font-size: 14px; line-height: 1.3;
}
.toc .entry span:last-child { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.toc .entry:hover { color: var(--accent); }
.toc .d0 > .row .entry { font-weight: 600; }
.toc .active > .row { background: var(--panel-2); box-shadow: inset 3px 0 var(--accent); }
.toc .active > .row .entry { color: var(--accent); }

/* ---------- Search results ---------- */
.results { padding: 8px; display: none; }
aside.searching .results { display: block; }
aside.searching .toc { display: none; }
.results .count { color: var(--muted); font-size: 13px; padding: 4px 6px 8px; }
.result {
  display: block; width: 100%; text-align: left; border: 1px solid transparent; background: none;
  border-radius: 8px; padding: 8px; margin-bottom: 2px;
}
.result:hover, .result.sel { background: var(--panel-2); border-color: var(--border); }
.result .where { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.result .where b { color: var(--accent); }
.result .snip { font-size: 13.5px; margin-top: 2px; }
mark { background: var(--hit-strong); color: inherit; border-radius: 2px; }

/* ---------- Pages ---------- */
#pages { padding: 16px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.page {
  position: relative; width: 100%; max-width: var(--pw, 1200px); background: #fff;
  box-shadow: var(--shadow); container-type: inline-size; border-radius: 2px; overflow: hidden;
  scroll-margin-top: 12px;
}
.page img, .page .svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.page .svg svg { width: 100%; height: 100%; display: block; }
[data-filter="dim"] .page :is(img, .svg) { filter: brightness(.72); }
[data-filter="invert"] .page :is(img, .svg) { filter: invert(.92) hue-rotate(180deg); }
/* HTML view: the SVG text is the real, selectable text; the overlay only draws search highlights */
.mode-html .tl { pointer-events: none; }
.mode-html .tl span { user-select: none; }
[data-filter="invert"] .page, [data-filter="dim"] .page { background: #222; }
.tl { position: absolute; inset: 0; line-height: 1; }
.tl span {
  position: absolute; white-space: pre; color: transparent; overflow: hidden;
  font-family: Calibri, Carlito, "Segoe UI", sans-serif; cursor: text;
}
.tl span::selection { background: rgba(0, 110, 255, .35); }
.tl span.hit { background: var(--hit); border-radius: 2px; }
.tl span.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0%, 40% { background: var(--hit-strong); } }
.page .pno {
  position: absolute; left: 6px; bottom: 6px; font-size: 11px; padding: 1px 6px; border-radius: 4px;
  background: rgba(0,0,0,.55); color: #fff; pointer-events: none;
}
.page .zoom {
  position: absolute; right: 6px; top: 6px; z-index: 2; width: 32px; height: 32px; border-radius: 8px;
  border: 0; background: rgba(0,0,0,.55); color: #fff; font-size: 16px; opacity: 0; transition: opacity .15s;
}
.page:hover .zoom, .page .zoom:focus { opacity: 1; }
@media (hover: none) { .page .zoom { opacity: .8; } }

/* Single-page (kneeboard) mode */
.single #pages { padding: 8px; height: 100%; justify-content: center; }
.single .page { display: none; }
.single .page.cur {
  display: block; max-width: min(100%, calc((100dvh - var(--hdr, 60px) - 16px) * var(--ar, 1.777)));
}
.flip {
  position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; display: none;
  width: 44px; height: 88px; border-radius: 10px; border: 1px solid var(--border);
  background: color-mix(in srgb, var(--panel) 80%, transparent); font-size: 22px;
}
.single .flip { display: block; }
#prevBtn { left: 8px; } #nextBtn { right: 8px; }

/* ---------- Lightbox ---------- */
#lightbox {
  position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.92); display: none; overflow: auto;
}
#lightbox.open { display: block; }
#lightbox .lbimg { display: block; width: 200%; max-width: none; cursor: zoom-out; }
#lightbox.fit .lbimg { width: 100%; cursor: zoom-in; }
#lightbox .lbimg svg { display: block; width: 100%; height: auto; background: #fff; }
a.iconbtn { text-decoration: none; color: inherit; font-size: 13px; white-space: nowrap; }
#lightbox .close {
  position: fixed; right: 12px; top: 12px; width: 44px; height: 44px; border-radius: 10px; border: 0;
  background: rgba(255,255,255,.15); color: #fff; font-size: 20px;
}

/* ---------- Checklists ---------- */
.wrap { max-width: 860px; margin: 0 auto; padding: 16px; }
.cl-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip {
  border: 1px solid var(--border); background: var(--panel); border-radius: 999px; padding: 6px 12px; font-size: 14px;
}
.chip[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.chip .n { opacity: .75; font-size: 12px; margin-left: 4px; }
.cl-head {
  position: sticky; top: 0; z-index: 3; background: var(--bg); padding: 8px 0 10px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
}
.cl-head h2 { margin: 0; font-size: 20px; flex: 1; min-width: 160px; }
.progress { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; flex-basis: 100%; }
.progress div { height: 100%; background: var(--check); transition: width .2s; }
.group { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; margin: 12px 0; overflow: hidden; }
.group h3 {
  margin: 0; padding: 10px 14px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
  color: var(--muted); background: var(--panel-2); display: flex; justify-content: space-between;
}
.item {
  display: flex; align-items: flex-start; gap: 12px; padding: 11px 14px; border-top: 1px solid var(--border);
  cursor: pointer; user-select: none;
}
.item:first-of-type { border-top: 0; }
.item input { width: 22px; height: 22px; margin: 0; flex: none; accent-color: var(--check); cursor: pointer; }
.item .txt { flex: 1; }
.item.done .txt { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--muted); }
.item.next { box-shadow: inset 3px 0 var(--accent); }
.hide-done .item.done { display: none; }
.pg {
  flex: none; font-size: 12px; padding: 2px 8px; border-radius: 6px; border: 1px solid var(--border);
  background: var(--panel-2); color: var(--muted); text-decoration: none; font-variant-numeric: tabular-nums;
}
.pg:hover { color: var(--accent); border-color: var(--accent); }

/* ---------- Quick reference ---------- */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.card h3 { margin: 0; padding: 10px 14px; font-size: 15px; background: var(--panel-2); border-bottom: 1px solid var(--border); }
.card table { width: 100%; border-collapse: collapse; font-size: 14px; }
.card td { padding: 7px 14px; border-top: 1px solid var(--border); vertical-align: top; }
.card tr:first-child td { border-top: 0; }
.card td:first-child { font-weight: 600; width: 42%; }
.card.mono td:first-child { font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
.card td:last-child { width: 1%; text-align: right; padding-left: 0; }
#quickref.wrap { max-width: 1240px; }
.note { color: var(--muted); font-size: 13px; margin: 18px 0 0; }

/* ---------- Responsive ---------- */
.scrim { display: none; }
@media (max-width: 900px) {
  aside {
    position: absolute; inset: 0 auto 0 0; z-index: 20; width: min(340px, 86vw);
    transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow);
  }
  body.nav-open aside { transform: none; }
  body.nav-open .scrim { display: block; position: absolute; inset: 0; z-index: 15; background: rgba(0,0,0,.4); }
  #pages { padding: 8px; gap: 8px; }
  .wrap { padding: 12px; }
}
@media (min-width: 901px) { #navBtn { display: none; } body.nav-hidden aside { display: none; } }
@media (max-width: 640px) {
  header { padding: 6px 8px; gap: 6px; }
  .brand { display: none; }
  #settings { order: 3; margin-left: auto; }
  #search { order: 4; flex: 1 1 calc(100% - 170px); }
  #pagebox { order: 5; }
  #modeBtn { order: 6; }
  body:not(.guide-tab) #search { flex-basis: 100%; }
  .tabs button { padding: 6px 9px; }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body class="guide-tab mode-image">
<header>
  <button class="iconbtn" id="navBtn" title="Contents (T)" aria-label="Toggle contents">☰</button>
  <div class="brand">F/A-18C <small>Chuck's Guide</small></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="guide" aria-selected="true">Guide</button>
    <button role="tab" data-tab="checklists" aria-selected="false">Checklists</button>
    <button role="tab" data-tab="quickref" aria-selected="false">Quick Ref</button>
  </div>
  <input id="search" type="search" placeholder="Search guide…  ( / )" autocomplete="off" spellcheck="false">
  <div class="pagebox" id="pagebox">
    <input id="pageInput" inputmode="numeric" aria-label="Page number"> <span id="pageTotal"></span>
  </div>
  <button class="iconbtn" id="modeBtn" title="Toggle single-page kneeboard mode (M)">▭</button>
  <a class="iconbtn" id="altView" href="guide.html" title="Open this page in the HTML view (live text, vector graphics)">HTML view</a>
  <div class="settings" id="settings">
    <button class="iconbtn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
    <div class="settings-pop">
      <label>Theme <select id="themeSel"><option value="light">Light</option><option value="dark">Dark</option><option value="night">Night (red)</option></select></label>
      <label>Pages <select id="filterSel"><option value="none">Original</option><option value="dim">Dimmed</option><option value="invert">Inverted</option></select></label>
      <label>Page width <select id="widthSel"><option value="800px">Small</option><option value="1200px">Medium</option><option value="1600px">Large</option><option value="100%">Fit width</option></select></label>
    </div>
  </div>
</header>
<div class="layout">
  <aside id="aside">
    <ul class="toc" id="toc"></ul>
    <div class="results" id="results"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main id="main">
    <section class="view active" id="view-guide">
      <button class="flip" id="prevBtn" aria-label="Previous page">‹</button>
      <button class="flip" id="nextBtn" aria-label="Next page">›</button>
      <div id="pages"></div>
    </section>
    <section class="view" id="view-checklists"><div class="wrap" id="checklists"></div></section>
    <section class="view" id="view-quickref"><div class="wrap" id="quickref"></div></section>
  </main>
</div>
<div id="lightbox" class="fit"><button class="close" aria-label="Close">✕</button><div class="lbimg"></div></div>

<script src="data.js"></script>
<script>
(() => {
  const G = window.GUIDE;
  const N = G.pageCount;
  const HTML_VIEW = "image" === "html";
  const svgFailed = new Set(G.svgFailed || []);
  const $ = (s, r = document) => r.querySelector(s);
  const el = (tag, props = {}, ...kids) => {
    const e = Object.assign(document.createElement(tag), props);
    for (const k of kids) if (k != null) e.append(k);
    return e;
  };
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const pad = p => String(p).padStart(3, "0");

  // localStorage can be unavailable (private mode, file:// restrictions): never let it break the page
  const KEY = "chuck:" + G.short + ":";
  const store = {
    get(k, d) { try { const v = localStorage.getItem(KEY + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem(KEY + k, JSON.stringify(v)); } catch {} },
  };

  const root = document.documentElement, body = document.body, main = $("#main"), aside = $("#aside");

  /* ---------- Settings ---------- */
  const settings = Object.assign({ theme: "dark", filter: "none", width: "1200px", single: false }, store.get("settings", {}));
  function applySettings() {
    root.dataset.theme = settings.theme;
    root.dataset.filter = settings.filter;
    root.style.setProperty("--pw", settings.width);
    $("#themeSel").value = settings.theme;
    $("#filterSel").value = settings.filter;
    $("#widthSel").value = settings.width;
    main.classList.toggle("single", settings.single);
    $("#modeBtn").textContent = settings.single ? "☰" : "▭";
    $("#modeBtn").title = settings.single ? "Switch to continuous scroll (M)" : "Switch to single-page kneeboard mode (M)";
    store.set("settings", settings);
  }
  $("#settingsBtn").onclick = e => { e.stopPropagation(); $("#settings").classList.toggle("open"); };
  document.addEventListener("click", e => { if (!$("#settings").contains(e.target)) $("#settings").classList.remove("open"); });
  $("#themeSel").onchange = e => { settings.theme = e.target.value; applySettings(); };
  $("#filterSel").onchange = e => { settings.filter = e.target.value; applySettings(); };
  $("#widthSel").onchange = e => { const p = current; settings.width = e.target.value; applySettings(); goPage(p, false); };

  /* ---------- Sections (page -> outline entry) ---------- */
  const outline = G.outline;
  const parentOf = [];
  { const stack = []; outline.forEach((o, i) => { stack.length = o.depth; parentOf[i] = o.depth ? stack[o.depth - 1] : -1; stack[o.depth] = i; }); }
  const secOf = new Int32Array(N + 1).fill(-1);
  { let idx = -1; for (let p = 1; p <= N; p++) { while (idx + 1 < outline.length && outline[idx + 1].page <= p) idx++; secOf[p] = idx; } }
  const sectionPath = p => { const out = []; for (let i = secOf[p]; i >= 0; i = parentOf[i]) out.unshift(outline[i].title); return out; };

  /* ---------- TOC ---------- */
  const tocLis = [];
  (function buildToc() {
    const rootUl = $("#toc"); const stack = [rootUl];
    outline.forEach((o, i) => {
      const hasKids = i + 1 < outline.length && outline[i + 1].depth > o.depth;
      const caret = el("button", { className: "caret" + (hasKids ? "" : " none"), textContent: "▶", tabIndex: hasKids ? 0 : -1, ariaLabel: "Expand" });
      const entry = el("button", { className: "entry" }, el("span", { textContent: o.title }), el("span", { textContent: o.page }));
      const li = el("li", { className: "d" + Math.min(o.depth, 3) }, el("div", { className: "row" }, caret, entry));
      li.querySelector(".row").style.paddingLeft = (o.depth * 12) + "px";
      caret.onclick = () => li.classList.toggle("open");
      entry.onclick = () => { li.classList.add("open"); showTab("guide"); goPage(o.page); closeNav(); };
      stack.length = o.depth + 1;
      (stack[o.depth] || stack[stack.length - 1]).append(li);
      if (hasKids) { const ul = el("ul"); li.append(ul); stack[o.depth + 1] = ul; }
      tocLis[i] = li;
    });
  })();
  let activeToc = -1;
  function markToc(p) {
    const i = secOf[p];
    if (i === activeToc) return;
    if (activeToc >= 0) tocLis[activeToc].classList.remove("active");
    activeToc = i;
    if (i < 0) return;
    tocLis[i].classList.add("active");
    for (let j = parentOf[i]; j >= 0; j = parentOf[j]) tocLis[j].classList.add("open");
    if (!aside.classList.contains("searching")) tocLis[i].querySelector(".row").scrollIntoView({ block: "nearest" });
  }

  /* ---------- Pages ---------- */
  const pagesEl = $("#pages");
  const pageEls = [null];
  for (let p = 1; p <= N; p++) {
    const pg = G.pages[p - 1];
    const div = el("div", { className: "page", id: "p" + p });
    div.dataset.p = p;
    div.style.aspectRatio = pg.w + " / " + pg.h;
    div.append(
      HTML_VIEW && !svgFailed.has(p)
        ? el("div", { className: "svg" })
        : el("img", { src: "pages/p" + pad(p) + ".jpg", loading: "lazy", decoding: "async", alt: "Page " + p, draggable: false }),
      el("div", { className: "tl" }),
      el("span", { className: "pno", textContent: p }),
      el("button", { className: "zoom", textContent: "⤢", title: "Zoom image", ariaLabel: "Zoom page " + p }),
    );
    pagesEl.append(div);
    pageEls.push(div);
  }
  $("#pageTotal").textContent = "/ " + N;
  root.style.setProperty("--ar", (G.pages[0].w / G.pages[0].h).toFixed(4));

  // Transparent text layer: built lazily for pages near the viewport, so text is selectable and hits can be highlighted in place
  function buildTextLayer(p) {
    const div = pageEls[p], tl = div.querySelector(".tl");
    if (tl.dataset.built) return;
    tl.dataset.built = 1;
    const pg = G.pages[p - 1], W = pg.w, H = pg.h, frag = document.createDocumentFragment();
    pg.lines.forEach(([x, y, w, h, size, text], i) => {
      const s = el("span", { textContent: text });
      s.dataset.i = i;
      s.style.cssText = `left:${x / W * 100}%;top:${y / H * 100}%;width:${w / W * 100}%;height:${h / H * 100}%;font-size:${size / W * 100}cqw`;
      frag.append(s);
    });
    tl.append(frag);
    applyHits(p);
  }
  const lazyText = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    buildTextLayer(+e.target.dataset.p);
    loadSvg(+e.target.dataset.p);
  }), { root: main, rootMargin: "1200px 0px" });
  pageEls.slice(1).forEach(d => lazyText.observe(d));

  // HTML view: each page's SVG lives in svg/pNNN.js (a script, so it also loads over file://).
  // Pages far from the viewport are emptied again to keep the document light.
  window.GUIDE_SVG = (p, markup) => {
    const box = pageEls[p]?.querySelector(".svg");
    if (!box || box.dataset.state !== "loading") return;
    box.innerHTML = markup;
    box.dataset.state = "done";
  };
  function loadSvg(p) {
    const box = pageEls[p].querySelector(".svg");
    if (!box || box.dataset.state) return;
    box.dataset.state = "loading";
    const s = el("script", { src: "svg/p" + pad(p) + ".js" });
    s.onload = () => s.remove();
    s.onerror = () => { s.remove(); box.replaceWith(el("img", { src: "pages/p" + pad(p) + ".jpg", alt: "Page " + p, draggable: false })); };
    document.head.append(s);
  }
  if (HTML_VIEW) {
    const unload = new IntersectionObserver(es => es.forEach(e => {
      const box = e.target.querySelector(".svg");
      if (!e.isIntersecting && box?.dataset.state === "done") { box.replaceChildren(); delete box.dataset.state; }
    }), { root: main, rootMargin: "8000px 0px" });
    pageEls.slice(1).forEach(d => unload.observe(d));
  }

  // Track the page at the top of the viewport
  let current = 1;
  const visible = new Set();
  const seen = new IntersectionObserver(es => {
    if (settings.single) return;
    es.forEach(e => e.isIntersecting ? visible.add(+e.target.dataset.p) : visible.delete(+e.target.dataset.p));
    if (!visible.size) return;
    const top = main.getBoundingClientRect().top + 40;
    let best = Math.min(...visible);
    for (const p of [...visible].sort((a, b) => a - b)) { if (pageEls[p].getBoundingClientRect().top <= top) best = p; }
    setCurrent(best);
  }, { root: main, threshold: [0, .25, .5, .75, 1] });
  pageEls.slice(1).forEach(d => seen.observe(d));

  function setCurrent(p, pushHash = true) {
    current = p;
    $("#pageInput").value = p;
    markToc(p);
    store.set("page", p);
    if (pushHash && activeTab === "guide") history.replaceState(null, "", "#p" + p);
  }

  function goPage(p, smooth = false) {
    p = Math.max(1, Math.min(N, p | 0));
    if (settings.single) {
      pageEls[current]?.classList.remove("cur");
      pageEls[p].classList.add("cur");
      const img = pageEls[p].querySelector("img");
      if (img) img.loading = "eager";
      buildTextLayer(p);
      loadSvg(p);
      main.scrollTop = 0;
    } else {
      pageEls[p].scrollIntoView({ block: "start", behavior: smooth ? "smooth" : "auto" });
    }
    setCurrent(p);
  }

  $("#pageInput").addEventListener("change", e => goPage(+e.target.value));
  $("#pageInput").addEventListener("focus", e => e.target.select());
  $("#prevBtn").onclick = () => goPage(current - 1);
  $("#nextBtn").onclick = () => goPage(current + 1);
  $("#modeBtn").onclick = toggleMode;
  // Switch between the image view and the HTML view on the same page
  if ($("#altView")) $("#altView").onclick = e => { e.currentTarget.href = e.currentTarget.getAttribute("href").split("#")[0] + "#p" + current; };
  function toggleMode() {
    const p = current;
    pageEls[p].classList.remove("cur");
    settings.single = !settings.single;
    applySettings();
    goPage(p);
  }

  // Swipe to flip pages in single-page mode
  let sx = null, sy = null;
  main.addEventListener("pointerdown", e => { if (settings.single && e.pointerType !== "mouse") { sx = e.clientX; sy = e.clientY; } });
  main.addEventListener("pointerup", e => {
    if (sx == null) return;
    const dx = e.clientX - sx, dy = e.clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5 && !window.getSelection().toString()) goPage(current + (dx < 0 ? 1 : -1));
  });

  /* ---------- Lightbox ---------- */
  const lb = $("#lightbox"), lbImg = $("#lightbox .lbimg");
  pagesEl.addEventListener("click", e => {
    const z = e.target.closest(".zoom"); if (!z) return;
    const src = z.parentElement.querySelector("img, .svg svg");
    if (!src) return;
    lbImg.replaceChildren(src.tagName === "IMG" ? el("img", { src: src.src, alt: "" }) : src.cloneNode(true));
    lbImg.querySelector("img")?.style.setProperty("width", "100%");
    lb.classList.add("open", "fit");
  });
  lbImg.onclick = e => {
    const r = lbImg.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
    lb.classList.toggle("fit");
    if (!lb.classList.contains("fit")) { lb.scrollLeft = fx * lbImg.offsetWidth - innerWidth / 2; lb.scrollTop = fy * lbImg.offsetHeight - innerHeight / 2; }
  };
  const closeLb = () => lb.classList.remove("open");
  $("#lightbox .close").onclick = closeLb;

  /* ---------- Search ---------- */
  const pageText = G.pages.map(pg => pg.lines.map(l => l[5]).join(" ").toLowerCase());
  let terms = [];
  const hitPages = new Set();
  const resultsEl = $("#results");
  let selIdx = -1;

  function parseQuery(q) {
    const out = [];
    q.toLowerCase().replace(/"([^"]+)"|(\S+)/g, (_, a, b) => { const t = (a || b).trim(); if (t) out.push(t); });
    return out;
  }
  function lineMatches(text) { const t = text.toLowerCase(); return terms.some(term => t.includes(term)); }
  function applyHits(p) {
    const tl = pageEls[p].querySelector(".tl");
    if (!tl.dataset.built) return;
    const on = hitPages.has(p);
    for (const s of tl.children) s.classList.toggle("hit", on && lineMatches(s.textContent));
  }
  function snippet(p) {
    const lines = G.pages[p - 1].lines.map(l => l[5]);
    const i = Math.max(0, lines.findIndex(l => lineMatches(l)));
    let text = lines.slice(i, i + 3).join(" ");
    if (text.length > 180) text = text.slice(0, 180) + "…";
    let html = esc(text);
    for (const t of terms) html = html.replace(new RegExp(esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi"), m => "<mark>" + m + "</mark>");
    return html;
  }
  function runSearch(q) {
    const old = [...hitPages];
    terms = parseQuery(q).filter(t => t.length >= 2 || /\d/.test(t));
    hitPages.clear();
    selIdx = -1;
    if (!terms.length) {
      aside.classList.remove("searching");
      old.forEach(applyHits);
      return;
    }
    const scored = [];
    for (let p = 1; p <= N; p++) {
      const t = pageText[p - 1];
      if (!terms.every(term => t.includes(term))) continue;
      let score = 0;
      for (const term of terms) { let i = -1; while ((i = t.indexOf(term, i + 1)) !== -1) score++; }
      // Prefer pages whose section title matches the query
      const sec = sectionPath(p).join(" ").toLowerCase();
      if (terms.every(term => sec.includes(term))) score += 25;
      scored.push([p, score]);
      hitPages.add(p);
    }
    scored.sort((a, b) => b[1] - a[1] || a[0] - b[0]);
    resultsEl.replaceChildren(el("div", { className: "count", textContent: scored.length ? `${scored.length} page${scored.length > 1 ? "s" : ""} match` : "No matches" }));
    for (const [p] of scored.slice(0, 200)) {
      const path = sectionPath(p);
      const b = el("button", { className: "result" });
      b.innerHTML = `<div class="where"><span>${esc(path[path.length - 1] || "")}</span><b>p.${p}</b></div><div class="snip">${snippet(p)}</div>`;
      b.onclick = () => openResult(p);
      resultsEl.append(b);
    }
    if (scored.length > 200) resultsEl.append(el("div", { className: "count", textContent: "Showing the top 200 — refine your search." }));
    aside.classList.add("searching");
    if (window.matchMedia("(max-width: 900px)").matches) body.classList.add("nav-open");
    new Set([...old, ...hitPages]).forEach(applyHits);
  }
  function openResult(p) {
    showTab("guide");
    goPage(p);
    closeNav();
    buildTextLayer(p);
    const spans = [...pageEls[p].querySelectorAll(".tl span.hit")];
    spans.forEach(s => { s.classList.remove("flash"); void s.offsetWidth; s.classList.add("flash"); });
    if (spans[0] && !settings.single) spans[0].scrollIntoView({ block: "center" });
  }
  let debounce;
  const searchEl = $("#search");
  searchEl.addEventListener("input", () => { clearTimeout(debounce); debounce = setTimeout(() => runSearch(searchEl.value), 160); });
  searchEl.addEventListener("keydown", e => {
    const items = [...resultsEl.querySelectorAll(".result")];
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!items.length) return;
      items[selIdx]?.classList.remove("sel");
      selIdx = (selIdx + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
      items[selIdx].classList.add("sel"); items[selIdx].scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter") {
      clearTimeout(debounce); runSearch(searchEl.value);
      const list = [...resultsEl.querySelectorAll(".result")];
      (list[Math.max(selIdx, 0)])?.click();
    } else if (e.key === "Escape") {
      searchEl.value = ""; runSearch(""); searchEl.blur();
    }
  });

  /* ---------- Nav drawer ---------- */
  const closeNav = () => body.classList.remove("nav-open");
  $("#navBtn").onclick = () => body.classList.toggle("nav-open");
  $("#scrim").onclick = closeNav;

  /* ---------- Tabs ---------- */
  let activeTab = "guide";
  function showTab(t) {
    activeTab = t;
    document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + t));
    body.classList.toggle("guide-tab", t === "guide");
    if (t === "guide") { history.replaceState(null, "", "#p" + current); requestAnimationFrame(() => goPage(current)); }
    else if (t === "checklists") { history.replaceState(null, "", "#cl=" + activeCl); main.scrollTop = 0; }
    else { history.replaceState(null, "", "#qr"); main.scrollTop = 0; }
    store.set("tab", t);
  }
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));

  const pageLink = p => {
    const a = el("a", { className: "pg", href: "#p" + p, textContent: "p." + p, title: "Open page " + p + " in the guide" });
    a.onclick = e => { e.preventDefault(); e.stopPropagation(); showTab("guide"); goPage(p); };
    return a;
  };

  /* ---------- Checklists ---------- */
  const cls = G.checklists || [];
  let activeCl = store.get("cl", cls[0]?.id);
  if (!cls.some(c => c.id === activeCl)) activeCl = cls[0]?.id;
  const hideDone = { v: store.get("hideDone", false) };

  function renderChecklists() {
    const box = $("#checklists");
    if (!cls.length) { box.replaceChildren(el("p", { className: "note", textContent: "No checklists defined for this aircraft yet." })); return; }
    const cl = cls.find(c => c.id === activeCl);
    const state = new Set(store.get("cl:" + cl.id, []));
    const total = cl.groups.reduce((n, g) => n + g.items.length, 0);

    const tabs = el("div", { className: "cl-tabs", role: "tablist" });
    for (const c of cls) {
      const done = store.get("cl:" + c.id, []).length, n = c.groups.reduce((s, g) => s + g.items.length, 0);
      const b = el("button", { className: "chip", role: "tab" }, c.title, el("span", { className: "n", textContent: `${done}/${n}` }));
      b.setAttribute("aria-selected", c.id === cl.id);
      b.onclick = () => { activeCl = c.id; store.set("cl", c.id); history.replaceState(null, "", "#cl=" + c.id); renderChecklists(); main.scrollTop = 0; };
      tabs.append(b);
    }

    const bar = el("div"); const count = el("span", { className: "n" });
    const hideBtn = el("button", { className: "iconbtn", textContent: hideDone.v ? "Show done" : "Hide done" });
    const resetBtn = el("button", { className: "iconbtn", textContent: "Reset" });
    const head = el("div", { className: "cl-head" }, el("h2", { textContent: cl.title }), count, hideBtn, resetBtn, el("div", { className: "progress" }, bar));

    const list = el("div", { className: hideDone.v ? "hide-done" : "" });
    const rows = [];
    cl.groups.forEach((g, gi) => {
      const gc = el("span");
      const grp = el("div", { className: "group" }, el("h3", {}, el("span", { textContent: g.title }), gc));
      g.items.forEach(([text, page], ii) => {
        const key = gi + "-" + ii;
        const cb = el("input", { type: "checkbox", checked: state.has(key) });
        const row = el("label", { className: "item" }, cb, el("span", { className: "txt", textContent: text }), page ? pageLink(page) : null);
        cb.onchange = () => { cb.checked ? state.add(key) : state.delete(key); store.set("cl:" + cl.id, [...state]); update(); };
        rows.push({ row, key, gi, gc });
        grp.append(row);
      });
      list.append(grp);
    });
    function update() {
      let firstOpen = true;
      const perGroup = {};
      for (const r of rows) {
        const done = state.has(r.key);
        r.row.classList.toggle("done", done);
        r.row.classList.toggle("next", !done && firstOpen);
        if (!done) firstOpen = false;
        perGroup[r.gi] = perGroup[r.gi] || [0, 0, r.gc];
        perGroup[r.gi][1]++; if (done) perGroup[r.gi][0]++;
      }
      for (const [d, n, gc] of Object.values(perGroup)) gc.textContent = `${d}/${n}`;
      count.textContent = `${state.size}/${total}`;
      bar.style.width = (state.size / total * 100) + "%";
      tabs.querySelector('[aria-selected="true"] .n').textContent = `${state.size}/${total}`;
    }
    hideBtn.onclick = () => { hideDone.v = !hideDone.v; store.set("hideDone", hideDone.v); list.className = hideDone.v ? "hide-done" : ""; hideBtn.textContent = hideDone.v ? "Show done" : "Hide done"; };
    resetBtn.onclick = () => { if (!state.size || confirm(`Reset "${cl.title}"?`)) { state.clear(); store.set("cl:" + cl.id, []); list.querySelectorAll("input").forEach(i => i.checked = false); update(); main.scrollTop = 0; } };
    box.replaceChildren(tabs, head, list, el("p", { className: "note", textContent: "Condensed from the guide. Tap a page number to see the full step with pictures. Progress is saved in this browser." }));
    update();
  }

  /* ---------- Quick reference ---------- */
  function renderQuickref() {
    const cards = el("div", { className: "cards" });
    for (const c of G.quickref || []) {
      const tbl = el("table");
      for (const [k, v, p] of c.rows) tbl.append(el("tr", {}, el("td", { textContent: k }), el("td", { textContent: v }), el("td", {}, p ? pageLink(p) : null)));
      cards.append(el("div", { className: "card" + (c.mono ? " mono" : "") }, el("h3", { textContent: c.title }), tbl));
    }
    $("#quickref").replaceChildren(cards, el("p", { className: "note", textContent: "Values taken from the guide; tap a page number to check the source." }));
  }

  /* ---------- Keyboard ---------- */
  document.addEventListener("keydown", e => {
    if (lb.classList.contains("open")) { if (e.key === "Escape") closeLb(); return; }
    if (e.target.matches("input, select, textarea") || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); searchEl.focus(); searchEl.select(); }
    else if (e.key === "Escape") { closeNav(); }
    else if (e.key === "1") showTab("guide");
    else if (e.key === "2") showTab("checklists");
    else if (e.key === "3") showTab("quickref");
    else if (activeTab !== "guide") return;
    else if (e.key === "m" || e.key === "M") toggleMode();
    else if (e.key === "t" || e.key === "T") window.matchMedia("(max-width: 900px)").matches ? body.classList.toggle("nav-open") : body.classList.toggle("nav-hidden");
    else if (e.key === "g") { e.preventDefault(); $("#pageInput").focus(); }
    else if (settings.single && ["ArrowRight", "PageDown", " ", "ArrowDown"].includes(e.key)) { e.preventDefault(); goPage(current + 1); }
    else if (settings.single && ["ArrowLeft", "PageUp", "ArrowUp"].includes(e.key)) { e.preventDefault(); goPage(current - 1); }
    else if (!settings.single && (e.key === "ArrowRight" || e.key === "n")) goPage(current + 1);
    else if (!settings.single && (e.key === "ArrowLeft" || e.key === "p")) goPage(current - 1);
  });

  /* ---------- Startup ---------- */
  const setHdr = () => root.style.setProperty("--hdr", $("header").offsetHeight + "px");
  addEventListener("resize", setHdr); setHdr();
  applySettings();
  renderChecklists();
  renderQuickref();

  function route() {
    const h = location.hash;
    let m;
    if ((m = h.match(/^#p(\d+)$/))) { showTab("guide"); goPage(+m[1]); }
    else if ((m = h.match(/^#cl=(.+)$/)) && cls.some(c => c.id === m[1])) { activeCl = m[1]; renderChecklists(); showTab("checklists"); }
    else if (h === "#qr") showTab("quickref");
    else return false;
    return true;
  }
  addEventListener("hashchange", route);
  if (!route()) {
    current = store.get("page", 1);
    const t = store.get("tab", "guide");
    showTab(["guide", "checklists", "quickref"].includes(t) ? t : "guide");
    if (t !== "guide") goPage(current);
  }
})();
</script>
</body>
</html>
