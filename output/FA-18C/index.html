<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>F/A-18C – Chuck's Guide</title>
<link rel="stylesheet" href="assets/viewer.css">
</head>
<body class="guide-tab">
<header>
  <button class="iconbtn" id="navBtn" title="Contents (T)" aria-label="Toggle contents">☰</button>
  <div class="brand">F/A-18C <small>Chuck's Guide</small></div>
  <div class="tabs" role="tablist">
    <button role="tab" data-tab="guide" aria-selected="true">Guide</button>
    <button role="tab" data-tab="checklists" aria-selected="false">Checklists</button>
    <button role="tab" data-tab="quickref" aria-selected="false">Quick Ref</button>
    <button role="tab" data-tab="weapons" aria-selected="false">Weapons</button>
    <button role="tab" data-tab="notes" aria-selected="false">Notes</button>
  </div>
  <input id="search" type="search" placeholder="Search guide…  ( / )" autocomplete="off" spellcheck="false">
  <div class="pagebox" id="pagebox">
    <input id="pageInput" inputmode="numeric" aria-label="Page number"> <span id="pageTotal"></span>
  </div>
  <button class="iconbtn" id="modeBtn" title="Toggle single-page kneeboard mode (M)">▭</button>
  <div class="settings" id="settings">
    <button class="iconbtn" id="settingsBtn" aria-label="Settings" title="Settings">⚙</button>
    <div class="settings-pop">
      <label>Theme <select id="themeSel"><option value="light">Light</option><option value="dark">Dark</option><option value="night">Night (red)</option></select></label>
      <label>Pages <select id="filterSel"><option value="none">Original</option><option value="dim">Dimmed</option><option value="invert">Inverted</option></select></label>
      <label>Page width <select id="widthSel"><option value="800px">Small</option><option value="1200px">Medium</option><option value="1600px">Large</option><option value="100%">Fit width</option></select></label>
      <label>Step ↔ callout links <input type="checkbox" id="stepsChk"></label>
      <label>Acronym tooltips <input type="checkbox" id="glossChk"></label>
    </div>
  </div>
</header>
<div class="layout">
  <aside id="aside">
    <ul class="toc" id="toc"></ul>
    <div class="results" id="results"></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <main id="main">
    <section class="view active" id="view-guide">
      <button class="flip" id="prevBtn" aria-label="Previous page">‹</button>
      <button class="flip" id="nextBtn" aria-label="Next page">›</button>
      <div id="pages"></div>
    </section>
    <section class="view" id="view-checklists"><div class="wrap" id="checklists"></div></section>
    <section class="view" id="view-quickref"><div class="wrap wide" id="quickref"></div></section>
    <section class="view" id="view-weapons"><div class="wrap wide" id="weapons"></div></section>
    <section class="view" id="view-notes"><div class="wrap" id="notes"></div></section>
  </main>
</div>

<div id="lightbox" class="fit"><button class="close" aria-label="Close">✕</button><div class="lbimg"></div></div>
<div id="tip" class="float" role="tooltip"></div>
<div id="selbar" class="float"></div>
<div id="notepop" class="float"></div>
<div id="walkbar" class="float"></div>

<script src="data.js"></script>
<script src="assets/viewer.js"></script>
<script src="assets/reading.js"></script>
<script src="assets/weapons.js"></script>
</body>
</html>
