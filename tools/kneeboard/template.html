<!doctype html>
<html lang="en" data-theme="kb-light">
<head>
<meta charset="utf-8">
<title>Kneeboard</title>
<link rel="stylesheet" href="../viewer/viewer.css">
<link rel="stylesheet" href="kneeboard.css">
</head>
<body>
<div id="sheets"></div>
<script>
// Lays out checklists, quick-ref cards and weapon steps as portrait kneeboard sheets.
// kneeboard.mjs opens this page with ?data=<data.js URL>&airfields=<airfields.js URL>&theme=<theme> and screenshots each .sheet.
(() => {
  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get("theme") || "kb-light";
  const load = src => new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => fail("could not load " + src);
    document.head.append(s);
  });
  // The airfield tables are shared by every aircraft (output/airfields.js), the rest is the aircraft's data.js
  Promise.all([load(q.get("data")), q.get("airfields") && load(q.get("airfields"))])
    .then(() => { build({ ...window.GUIDE, airfields: window.AIRFIELDS || [] }); window.KNEEBOARD_READY = true; })
    .catch(e => { window.KNEEBOARD_READY = String(e); });

  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const sheetsEl = document.getElementById("sheets");

  // "Item – STATE" becomes a leader-dot row; other text fills the line
  function row(text, page, box, note) {
    const r = el("div", "row" + (box ? " box" : ""));
    const i = text.indexOf(" – ");
    if (i > 0) r.append(el("span", "k", text.slice(0, i)), el("span", "dots"), el("span", "v", text.slice(i + 3)));
    else r.append(el("span", "k grow", text));
    if (note) r.querySelector(".k").append(el("span", "note", note));
    if (page) r.append(el("span", "p", "p." + page));
    return r;
  }

  // One airfield as two (or more) lines: name / coordinates, elevation, navaids, radios, then a line per runway end
  const f2 = n => n.toFixed(2);
  function airfield(a) {
    const box = el("div", "afk" + (a.closed ? " closed" : ""));
    const navs = [a.tacan && ["tacan", a.tacan], a.vor && ["vor", f2(a.vor)], ...[].concat(a.ndb ?? []).map(n => ["ndb", n]), a.rsbn && ["rsbn", a.rsbn],
      a.ndbOff && ["ndb off", "NDB"], a.navNote && ["note", a.navNote]].filter(Boolean);
    const [, h1, d1, m1, dec1, h2, d2, m2, dec2] = a.ll.match(/([NS])(\d+)°(\d+)'\d+\/(\.\d+) ([EW])(\d+)°(\d+)'\d+\/(\.\d+)/);
    const sides = a.rwy.flatMap(r => r.text ? [el("span", "side norwy", r.text.join(" · "))] : r.sides.map((s, i) => {
      const line = el("span", "side");
      const bits = [];
      if (s.ils) bits.push(["ils", f2(s.ils)], ...(s.ilsNote ? [["note ils", s.ilsNote.replace("LOC CRS ", "CRS ")]] : []));
      else if (s.ilsOff) bits.push(["ils off", "ILS"]);
      else if (s.prmg) bits.push(["prmg", s.prmg]);
      if (s.outer || s.inner) bits.push(s.outer ? ["ndb", s.outer] : ["muted", "–"], ...(s.inner ? [["ndb", s.inner]] : []));
      if (s.note) bits.push(["note", s.note]);
      if (r.note && i === r.sides.length - 1) bits.push(["note", r.note]);
      bits.forEach(([c, t], k) => line.append(el("span", c, t), el("span", "sep", bits[k + 1]?.[0] === "note ils" ? " " : " › ")));
      line.append(String(s.hdg).padStart(3, "0") + "° ", el("b", "rwy" + ((r.short ?? r.len[0] < 6000) ? " short" : "") + (r.badName ? " bad" : ""), (s.active ? "•" : "") + s.rwy));
      return line;
    }));
    const cell = (cls, ...kids) => { const c = el("span", cls); c.append(...kids.filter(k => k != null && k !== "")); return c; };
    const name = cell("name", el("b", "", a.name), a.icao ? el("span", "icao", " " + a.icao) : null, a.type ? el("span", "icao", " (heliport)") : null);
    const atcText = a.closed || a.atcNote;
    box.append(
      cell("col", name, el("span", "ll", `${h1}${d1}°${m1}${dec1} ${h2}${d2}°${m2}${dec2}`)),
      cell("col r", String(a.elev[0]), el("span", "muted", String(a.elev[1]))),
      cell("col c", ...navs.map(([c, t]) => el("span", c, String(t)))),
      atcText ? cell("col closedtxt", atcText) : cell("col", el("span", "", f2(a.atc[0])), el("span", "uhf", f2(a.atc[2]))),
      cell("col r sides", ...sides));
    if (a.remark) box.append(el("span", "remark", a.remark));
    return box;
  }

  function build(G) {
    const sections = [];
    // ?minimal=1 drops each checklist's realism-only "extras"
    const minimal = q.has("minimal");
    for (const c of G.checklists || []) {
      const skip = new Set(minimal ? c.extras || [] : []);
      sections.push({
        slug: c.id, title: c.title + (skip.size ? " · Essentials" : ""),
        groups: c.groups.map((g, gi) => ({
          title: g.title,
          rows: g.items.filter((_, ii) => !skip.has(gi + "-" + ii)).map(([t, p, , opt]) => row(t, p, true, opt?.note)),
        })).filter(g => g.rows.length),
      });
    }
    if ((G.quickref || []).length) sections.push({
      slug: "quickref", title: "Quick Reference",
      groups: G.quickref.map(c => ({ title: c.title, rows: c.rows.map(([k, v, p]) => {
        const r = el("div", "row qr" + (c.mono ? " mono" : ""));
        r.append(el("span", "k", k), el("span", "dots"), el("span", "v", v));
        if (p) r.append(el("span", "p", "p." + p));
        return r;
      }) })),
    });
    if ((G.weapons || []).length) sections.push({
      slug: "weapons", title: "Weapons",
      groups: G.weapons.map(w => ({ title: `${w.name} · ${w.type}`, rows: w.steps.map(([t, p], i) => {
        const r = row(t, p, false);
        r.prepend(el("span", "n", i + 1 + "."));
        return r;
      }) })),
    });

    // Airfields: one compact two-line block per airfield
    // Default: the aircraft JSON's "kneeboardMaps" (all maps without it); ?maps=all for every map
    const pick = q.get("maps") || (G.kneeboardMaps || []).join(",");
    const want = pick && pick !== "all" ? pick.split(",").map(s => s.trim().toLowerCase()) : null;
    for (const t of (G.airfields || []).filter(t => !want || want.includes(t.map.toLowerCase()))) {
      const header = () => {
        const h = el("div", "afk hdr");
        h.append(el("span", "", "Airfield"), el("span", "r", "ft/m"), el("span", "c", "Nav"), el("span", "", "VHF/UHF"), el("span", "r", "ILS/PRMG › NDBs › hdg rwy"));
        return h;
      };
      sections.push({ slug: "airfields-" + t.map.toLowerCase().replace(/[^a-z0-9]+/g, "-"), title: "Airfields · " + t.map, foot: "After Minsky's Aerodrome Data and Frequencies",
        groups: [{ title: [t.magvar && "Magvar " + t.magvar.split(" · ").pop(), t.valid && "hdgs valid " + t.valid].filter(Boolean).join(" · ") || t.map,
          header, rows: t.airfields.map(airfield) }] });
    }

    for (const sec of sections) {
      const sheets = [];
      let body;
      const newSheet = () => {
        const sh = el("div", "sheet");
        sh.dataset.slug = sec.slug;
        const head = el("div", "head");
        head.append(el("span", "ac", G.short), el("span", "title", sec.title), el("span", "num"));
        body = el("div", "body");
        sh.append(head, body, el("div", "foot", sec.foot || "Chuck's Guide · page numbers refer to the guide"));
        sheetsEl.append(sh);
        sheets.push(sh);
      };
      const over = () => body.scrollHeight > body.clientHeight + 1;
      newSheet();
      for (const g of sec.groups) {
        let bar = el("div", "bar", g.title), grp = el("div", "grp");
        // Split a group where it lands, unless fewer than 3 of its rows fit here: then start a new sheet
        body.append(bar, grp);
        if (g.header) grp.append(g.header());
        grp.append(...g.rows.slice(0, 3));
        if (over() && body.children.length > 2) {
          bar.remove(); grp.remove();
          newSheet();
          body.append(bar, grp);
        }
        grp.replaceChildren(...(g.header ? [g.header()] : []));
        for (const r of g.rows) {
          grp.append(r);
          if (!over()) continue;
          r.remove();
          const started = grp.children.length > (g.header ? 1 : 0);
          if (!started) { bar.remove(); grp.remove(); }
          newSheet();
          bar = el("div", "bar", started ? g.title + " (cont.)" : g.title);
          grp = el("div", "grp");
          body.append(bar, grp);
          if (g.header) grp.append(g.header());
          grp.append(r);
        }
      }
      sheets.forEach((sh, i) => { sh.querySelector(".num").textContent = sheets.length > 1 ? `${i + 1}/${sheets.length}` : ""; });
    }
  }
})();
</script>
</body>
</html>
